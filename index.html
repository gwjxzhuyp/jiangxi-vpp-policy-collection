<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>政策索引 - 虚拟电厂与独立储能政策门户</title>
  <style>body{font-family:Inter, "PingFang SC", "Microsoft YaHei", Arial;background:#f5f7fb;margin:0;color:#172033} .wrap{max-width:1000px;margin:36px auto;padding:20px} h1{margin:0 0 18px} .grid{display:flex;gap:18px} .card{flex:1;background:#fff;padding:20px;border-radius:12px;border:1px solid #e7ebf2;text-align:center} .card a{display:block;text-decoration:none;color:#1d4ed8;font-weight:700;margin-top:12px} </style>
</head>
<body>
  <div class="wrap">
    <h1>政策索引</h1>
    <p>请选择政策类别：点击进入“虚拟电厂”或“独立储能”，然后按省份浏览政策清单。江西政策在列表中单列突出显示。</p>
    <div class="grid">
      <div class="card">
        <h2>虚拟电厂（VPP）</h2>
        <p>省级实施细则、入市指南、建设与运营方案等</p>
        <a href="/vpp/">进入虚拟电厂政策</a>
      </div>
      <div class="card">
        <h2>独立储能（独立储能电站）</h2>
        <p>电网侧/独立储能参与市场、容量补偿、项目管理办法等</p>
        <a href="/storage/">进入独立储能政策</a>
      </div>
    </div>

    <p style="margin-top:24px;color:#6b7280">提示：数据来源见各政策条目的“原文”链接；如需把官方 PDF 存入仓库，请回复“下载原文”。</p>
  </div>
</body>
</html>
